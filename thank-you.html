<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" href="favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Pure Fabrication</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F7F6F4;--tp:#1C1C1C;--ts:#8C8C8C;--ac:#2B3A4A;--br:#D4D2CC;
  --serif:'Georgia',serif;--sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--tp);font-family:var(--sans);display:flex;align-items:center;justify-content:center;min-height:100vh}
.back-btn{position:fixed;top:1.8rem;left:2.5rem;font-size:0.62rem;letter-spacing:0.28em;text-transform:uppercase;color:var(--tp);text-decoration:none;border:1px solid var(--tp);padding:0.6rem 1.4rem;transition:all 0.25s}
.back-btn:hover{background:var(--tp);color:#fff}
.statement{max-width:900px;text-align:center;padding:5rem 2rem}
.stmt-rule{width:1px;height:60px;background:var(--ac);margin:3rem auto}
.stmt-text{font-family:var(--serif);font-size:clamp(1.9rem,3.2vw,2.9rem);font-weight:400;line-height:1.45;color:var(--tp)}
</style>
</head>
<body>
<a href="/" class="back-btn">← Home</a>
<div class="statement">
  <div class="stmt-rule"></div>
  <p class="stmt-text">"Your enquiry has been received.<br>We'll be in touch shortly."</p>
  <div class="stmt-rule"></div>
  <img src="logo-v3-upload2.png" alt="Pure Fabrication" style="height:80px;width:auto;display:block;margin:0 auto">
</div>
</body>
</html>
